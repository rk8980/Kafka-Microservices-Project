spring.application.name=notification-service

server.port=8083

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.type.mapping=com.example.deliveryservice.kafka.DeliveryCreatedEvent:com.example.notificationservice.kafka.DeliveryCreatedEvent,com.example.paymentservice.kafka.PaymentFailedEvent:com.example.notificationservice.kafka.PaymentFailedEvent
